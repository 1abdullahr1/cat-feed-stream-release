name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [ debug, release ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate keystore for release signing
        if: matrix.variant == 'release'
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias catfeed -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CatFeedStream, OU=CI, O=CatFeedStream, L=NA, S=NA, C=NA"

      - name: Build with Gradle
        run: ./gradlew assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catfeed-${{ matrix.variant }}-apk
          path: app/build/outputs/apk/${{ matrix.variant }}/*.apk
          retention-days: 14

